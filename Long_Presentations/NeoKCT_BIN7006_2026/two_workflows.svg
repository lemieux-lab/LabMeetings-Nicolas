<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 534" width="1600" height="534" font-family="'Archivo', sans-serif">
<rect x="0" y="0" width="1600" height="534" rx="14" fill="#151f1b"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#9db3ab"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3ecfa2"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e58468"/></marker><marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f0b429"/></marker></defs>
<text x="30" y="40" fill="#e58468" font-size="20" text-anchor="start" font-weight="700">Alignment-based validation (BamQuery): each peptide is translated backward, then filtered by the genome</text>
<rect x="30" y="58" width="230" height="110" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="48" y="92" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">Peptide</text>
<text x="48" y="120" fill="#9db3ab" font-size="15" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAP</text>
<text x="48" y="142" fill="#9db3ab" font-size="15" text-anchor="start">from mass spec</text>
<path d="M260,113 L300,113" stroke="#9db3ab" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="302" y="58" width="290" height="110" rx="10" fill="#1c2822" stroke="#e58468" stroke-width="2"/>
<text x="320" y="92" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">Back-translate</text>
<text x="320" y="120" fill="#f0b429" font-size="17" text-anchor="start" font-weight="700">294,912 DNA sequences</text>
<text x="320" y="142" fill="#9db3ab" font-size="15" text-anchor="start">could code for it</text>
<path d="M592,113 L632,113" stroke="#9db3ab" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="634" y="58" width="290" height="110" rx="10" fill="#1c2822" stroke="#e58468" stroke-width="2"/>
<text x="652" y="92" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">Keep those in GRCh38</text>
<text x="652" y="120" fill="#9db3ab" font-size="15" text-anchor="start">the reference genome</text>
<text x="652" y="142" fill="#9db3ab" font-size="15" text-anchor="start">filters them to a few loci</text>
<path d="M924,113 L964,113" stroke="#9db3ab" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="966" y="58" width="290" height="110" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="984" y="92" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">Read every BAM</text>
<text x="984" y="120" fill="#9db3ab" font-size="15" text-anchor="start">at those loci,</text>
<text x="984" y="142" fill="#9db3ab" font-size="15" text-anchor="start">2,489 GTEx samples</text>
<path d="M1256,113 L1296,113" stroke="#9db3ab" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="1298" y="58" width="230" height="110" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="1316" y="92" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">Counts</text>
<text x="1316" y="120" fill="#9db3ab" font-size="15" text-anchor="start">per peptide,</text>
<text x="1316" y="142" fill="#9db3ab" font-size="15" text-anchor="start">per sample</text>
<rect x="30" y="186" width="1540" height="70" rx="10" fill="#2e201b" stroke="#e58468" stroke-width="1.5"/>
<text x="50" y="215" fill="#e8efec" font-size="17" text-anchor="start" font-weight="700">AGLKVTSAP: 4 × 4 × 6 × 2 × 4 × 4 × 6 × 4 × 4 = 294,912 possible coding sequences.</text>
<text x="50" y="241" fill="#9db3ab" font-size="15" text-anchor="start">At 3.6 codons per residue on average, a 9-mer has about 100,000 and an 11-mer about 1.3 million.</text>
<g transform="translate(0,-248)">
<text x="30" y="548" fill="#3ecfa2" font-size="20" text-anchor="start" font-weight="700">NeoKCT: translate the reads forward instead, count once, then look up</text>
<rect x="30" y="566" width="270" height="110" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="48" y="600" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">RNA-seq reads</text>
<text x="48" y="628" fill="#9db3ab" font-size="15" text-anchor="start">all reads, no alignment,</text>
<text x="48" y="650" fill="#9db3ab" font-size="15" text-anchor="start">no reference</text>
<path d="M300,621 L346,621" stroke="#9db3ab" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="348" y="566" width="270" height="110" rx="10" fill="#1c2822" stroke="#f0b429" stroke-width="2"/>
<text x="366" y="600" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">Translate forward</text>
<text x="366" y="628" fill="#9db3ab" font-size="15" text-anchor="start">each 30-nt window gives</text>
<text x="366" y="650" fill="#9db3ab" font-size="15" text-anchor="start">exactly one 10-mer</text>
<path d="M618,621 L664,621" stroke="#9db3ab" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="666" y="566" width="270" height="110" rx="10" fill="#1c2822" stroke="#f0b429" stroke-width="2"/>
<text x="684" y="600" fill="#f0b429" font-size="19" text-anchor="start" font-weight="700">The table</text>
<text x="684" y="628" fill="#9db3ab" font-size="15" text-anchor="start">2,486 GTEx samples,</text>
<text x="684" y="650" fill="#9db3ab" font-size="15" text-anchor="start">62.6 billion fragments</text>
<path d="M936,621 L982,621" stroke="#3ecfa2" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<rect x="984" y="566" width="270" height="110" rx="10" fill="#1c2822" stroke="#3ecfa2" stroke-width="1.5"/>
<text x="1002" y="600" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">Look up</text>
<text x="1002" y="628" fill="#9db3ab" font-size="15" text-anchor="start">any peptide list,</text>
<text x="1002" y="650" fill="#9db3ab" font-size="15" text-anchor="start">any sequence</text>
<path d="M1254,621 L1300,621" stroke="#3ecfa2" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<rect x="1302" y="566" width="268" height="110" rx="10" fill="#1c2822" stroke="#3ecfa2" stroke-width="1.5"/>
<text x="1320" y="600" fill="#e8efec" font-size="19" text-anchor="start" font-weight="700">Counts</text>
<text x="1320" y="628" fill="#9db3ab" font-size="15" text-anchor="start">per peptide,</text>
<text x="1320" y="650" fill="#9db3ab" font-size="15" text-anchor="start">per sample</text>
<text x="483" y="700" fill="#f0b429" font-size="15" text-anchor="middle">one-time cost, about 10 days on one server</text>
<text x="1143" y="700" fill="#3ecfa2" font-size="15" text-anchor="middle">1,245 peptides x 2,486 samples: 0.5 s of lookup, ~46 min with loading</text>
<rect x="30" y="716" width="1540" height="44" rx="10" fill="#17281f" stroke="#3ecfa2" stroke-width="1.5"/>
<text x="50" y="744" fill="#e8efec" font-size="17" text-anchor="start">Going forward, translation has exactly one answer: no explosion, no genome filter, every peptide can be queried.</text>
</g>
</svg>