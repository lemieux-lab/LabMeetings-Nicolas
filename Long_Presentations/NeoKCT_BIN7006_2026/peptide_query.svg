<text x="1090" y="390" fill="#9db3ab" font-size="14" text-anchor="start">a read covering the whole 11-mer must</text>
<text x="1090" y="410" fill="#9db3ab" font-size="14" text-anchor="start">carry both fragments: an upper bound</text>
<text x="1570" y="590" fill="#9db3ab" font-size="13" text-anchor="end">Counts illustrative. · = absent, not stored. I/L ambiguity can be summed over on request (isobaric in MS).</text>
