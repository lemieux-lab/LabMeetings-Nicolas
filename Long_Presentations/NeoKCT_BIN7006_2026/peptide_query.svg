<text x="30" y="44" fill="#e8efec" font-size="20" text-anchor="start" font-weight="700">The table stores 10-amino-acid fragments. MHC-I peptides are 8 to 11 long, so a query has three cases.</text>
<rect x="30" y="70" width="500" height="500" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="50" y="104" fill="#3ecfa2" font-size="19" text-anchor="start" font-weight="700">Shorter than 10 (e.g. a 9-mer)</text>
<text x="50" y="132" fill="#9db3ab" font-size="15" text-anchor="start">fragments that start with it, and fragments</text>
<text x="50" y="154" fill="#9db3ab" font-size="15" text-anchor="start">that end with it: add each group, keep the larger</text>
<text x="330" y="200" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s1</text>
<text x="378" y="200" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s2</text>
<text x="426" y="200" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s3</text>
<text x="474" y="200" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s4</text>
<text x="50" y="232" fill="#f0b429" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAP</text>
<text x="136.39999999999998" y="232" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">A</text>
<text x="330" y="232" fill="#e8efec" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">3</text>
