<text x="50" y="500" fill="#9db3ab" font-size="14" text-anchor="start">if the next codon is a stop, nothing starts with</text>
<text x="50" y="520" fill="#9db3ab" font-size="14" text-anchor="start">the peptide, but fragments still end with it</text>
<rect x="550" y="70" width="500" height="500" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="570" y="104" fill="#3ecfa2" font-size="19" text-anchor="start" font-weight="700">Exactly 10</text>
<text x="570" y="132" fill="#9db3ab" font-size="15" text-anchor="start">one fragment, one row:</text>
<text x="570" y="154" fill="#9db3ab" font-size="15" text-anchor="start">read it directly</text>
<text x="850" y="210" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s1</text>
<text x="898" y="210" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s2</text>
<text x="946" y="210" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s3</text>
<text x="994" y="210" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s4</text>
<text x="570" y="246" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">MAGLKVTSAP</text>
<text x="850" y="246" fill="#e8efec" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">5</text>
<text x="898" y="246" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">·</text>
