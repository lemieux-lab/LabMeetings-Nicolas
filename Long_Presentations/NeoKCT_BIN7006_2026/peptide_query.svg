<rect x="1070" y="70" width="500" height="500" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="1090" y="104" fill="#3ecfa2" font-size="19" text-anchor="start" font-weight="700">Longer than 10 (e.g. an 11-mer)</text>
<text x="1090" y="132" fill="#9db3ab" font-size="15" text-anchor="start">two overlapping fragments:</text>
<text x="1090" y="154" fill="#9db3ab" font-size="15" text-anchor="start">keep the smaller count per sample</text>
<text x="1370" y="210" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s1</text>
<text x="1418" y="210" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s2</text>
<text x="1466" y="210" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s3</text>
<text x="1514" y="210" fill="#8fb0e8" font-size="15" text-anchor="middle" font-weight="700">s4</text>
<text x="1090" y="246" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">MAGLKVTSAP</text>
<text x="1370" y="246" fill="#e8efec" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">5</text>
<text x="1418" y="246" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">·</text>
