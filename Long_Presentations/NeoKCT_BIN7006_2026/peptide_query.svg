<text x="426" y="232" fill="#e8efec" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">1</text>
<text x="474" y="232" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">·</text>
<text x="50" y="262" fill="#f0b429" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAP</text>
<text x="136.39999999999998" y="262" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">Q</text>
<text x="330" y="262" fill="#e8efec" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">3</text>
<text x="378" y="262" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">·</text>
<text x="426" y="262" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">·</text>
<text x="474" y="262" fill="#e8efec" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">6</text>
<text x="50" y="292" fill="#f0b429" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAP</text>
<text x="136.39999999999998" y="292" fill="#e8efec" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">S</text>
<text x="330" y="292" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">·</text>
<text x="378" y="292" fill="#e8efec" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">2</text>
<text x="426" y="292" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">·</text>
<text x="474" y="292" fill="#e8efec" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">1</text>
<path d="M50,306 L510,306" stroke="#2a3a33" stroke-width="1.5"/>
