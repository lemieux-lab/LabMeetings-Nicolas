<text x="378" y="326" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">2</text>
<text x="426" y="326" fill="#9db3ab" font-size="16" text-anchor="middle" font-family="'JetBrains Mono', monospace">1</text>
