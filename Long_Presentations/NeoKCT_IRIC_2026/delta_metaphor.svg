<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="'Archivo', sans-serif">
<rect x="0" y="0" width="1600" height="640" rx="14" fill="#151f1b"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#9db3ab"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#3ecfa2"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e58468"/></marker><marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f0b429"/></marker></defs>
<text x="30" y="44" fill="#e8efec" font-size="20" text-anchor="start" font-weight="700">Sorted fragments only ever go up, so store the first one and then the gaps</text>
<rect x="30" y="70" width="560" height="420" rx="10" fill="#1c2822" stroke="#2a3a33" stroke-width="1.5"/>
<text x="50" y="104" fill="#3ecfa2" font-size="18" text-anchor="start" font-weight="700">Times at a finish line</text>
<text x="50" y="134" fill="#9db3ab" font-size="15" text-anchor="start" font-weight="700">runner</text>
<text x="190" y="134" fill="#9db3ab" font-size="15" text-anchor="start" font-weight="700">clock</text>
<text x="380" y="134" fill="#9db3ab" font-size="15" text-anchor="start" font-weight="700">written down</text>
<text x="50" y="186" fill="#9db3ab" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">#1</text>
<text x="190" y="186" fill="#e8efec" font-size="18" text-anchor="start" font-family="'JetBrains Mono', monospace">2:31:04</text>
<text x="380" y="186" fill="#f0b429" font-size="18" text-anchor="start" font-family="'JetBrains Mono', monospace">full time</text>
<text x="50" y="242" fill="#9db3ab" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">#2</text>
<text x="190" y="242" fill="#e8efec" font-size="18" text-anchor="start" font-family="'JetBrains Mono', monospace">2:31:09</text>
<text x="380" y="242" fill="#3ecfa2" font-size="18" text-anchor="start" font-family="'JetBrains Mono', monospace">+5 s</text>
<text x="50" y="298" fill="#9db3ab" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">#3</text>
<text x="190" y="298" fill="#e8efec" font-size="18" text-anchor="start" font-family="'JetBrains Mono', monospace">2:31:19</text>
<text x="380" y="298" fill="#3ecfa2" font-size="18" text-anchor="start" font-family="'JetBrains Mono', monospace">+10 s</text>
<text x="50" y="354" fill="#9db3ab" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">#4</text>
<text x="190" y="354" fill="#e8efec" font-size="18" text-anchor="start" font-family="'JetBrains Mono', monospace">2:31:46</text>
<text x="380" y="354" fill="#3ecfa2" font-size="18" text-anchor="start" font-family="'JetBrains Mono', monospace">+27 s</text>
<text x="50" y="436" fill="#9db3ab" font-size="15" text-anchor="start">The clock never runs backward, so every gap</text>
<text x="50" y="460" fill="#9db3ab" font-size="15" text-anchor="start">is positive, and short when runners are close.</text>
<rect x="620" y="70" width="950" height="420" rx="10" fill="#1c2822" stroke="#f0b429" stroke-width="2"/>
<text x="640" y="104" fill="#f0b429" font-size="18" text-anchor="start" font-weight="700">Fragments are numbers too</text>
<text x="640" y="134" fill="#9db3ab" font-size="15" text-anchor="start">Each residue is written as 5 bits (A=0, R=1, N=2 … V=19), so a 10-mer becomes one 50-bit number.</text>
<text x="640" y="156" fill="#9db3ab" font-size="15" text-anchor="start">Sorting fragments alphabetically is the same as sorting those numbers, and the numbers only go up.</text>
<text x="640" y="194" fill="#8fb0e8" font-size="15" text-anchor="start" font-weight="700">fragment</text>
<text x="840" y="194" fill="#8fb0e8" font-size="15" text-anchor="start" font-weight="700">as a number</text>
<text x="1180" y="194" fill="#8fb0e8" font-size="15" text-anchor="start" font-weight="700">written down</text>
<text x="640" y="236" fill="#e8efec" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAPA</text>
<text x="840" y="236" fill="#9db3ab" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">8,052,644,741,568</text>
<text x="1180" y="236" fill="#f0b429" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">full number</text>
<text x="640" y="292" fill="#e8efec" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAPQ</text>
<text x="840" y="292" fill="#9db3ab" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">8,052,644,741,573</text>
<text x="1180" y="292" fill="#3ecfa2" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">+5</text>
<text x="640" y="348" fill="#e8efec" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSAPS</text>
<text x="840" y="348" fill="#9db3ab" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">8,052,644,741,583</text>
<text x="1180" y="348" fill="#3ecfa2" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">+10</text>
<text x="640" y="404" fill="#e8efec" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">AGLKVTSASL</text>
<text x="840" y="404" fill="#9db3ab" font-size="16" text-anchor="start" font-family="'JetBrains Mono', monospace">8,052,644,741,610</text>
<text x="1180" y="404" fill="#3ecfa2" font-size="17" text-anchor="start" font-family="'JetBrains Mono', monospace">+27</text>
<text x="640" y="460" fill="#9db3ab" font-size="15" text-anchor="start">A full number takes 8 bytes, a gap fits in 4.</text>
<rect x="30" y="512" width="1540" height="104" rx="10" fill="#17281f" stroke="#3ecfa2" stroke-width="1.5"/>
<text x="50" y="546" fill="#e8efec" font-size="17" text-anchor="start">Like a clock time posted at every checkpoint, the full number is written again every 256 fragments,</text>
<text x="50" y="574" fill="#e8efec" font-size="17" text-anchor="start">so reaching any fragment takes at most 255 small additions. Halves the storage for 62.6 billion sorted fragments.</text>
<text x="50" y="602" fill="#9db3ab" font-size="13" text-anchor="start">Fragment numbers and gaps are the real encodings of these four 10-mers, the runner times are made to match.</text>
</svg>