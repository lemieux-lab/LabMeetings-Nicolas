<text x="60" y="410" fill="#9db3ab" font-size="18">each cell = one block of 64 k-mers (~2.4 KB packed). oni has 1.8 TiB RAM, ~1.5 TiB left after the index, so most of the blob can sit in page cache*</text>
<text x="60" y="440" fill="#9db3ab" font-size="18">a cold first touch pulls in a ~1 MB read (NFS rsize), which covers a few hundred neighboring blocks*</text>
<rect x="1100" y="466" width="14" height="14" rx="3" fill="#e58468"/><text x="1120" y="478" fill="#9db3ab" font-size="15">cold first touch</text>
<rect x="1250" y="466" width="14" height="14" rx="3" fill="#3ecfa2"/><text x="1270" y="478" fill="#9db3ab" font-size="15">in page cache, warm</text>
<rect x="1430" y="466" width="14" height="14" rx="3" fill="#2a3a34"/><text x="1450" y="478" fill="#9db3ab" font-size="15">not cached yet</text>
<rect x="40" y="500" width="790" height="110" rx="10" fill="none" stroke="#e58468" stroke-width="2"/>
<text x="60" y="534" fill="#e58468" font-size="22">Random access, every row from a different place</text>
<text x="60" y="566" fill="#e8efec" font-size="19">Each lookup is a first touch, ~17 ms each</text>
<text x="60" y="594" fill="#e8efec" font-size="19">B2 sweep of 1e6 rows: ~387x slower than in RAM</text>
<rect x="870" y="500" width="790" height="110" rx="10" fill="none" stroke="#3ecfa2" stroke-width="2"/>
<text x="890" y="534" fill="#3ecfa2" font-size="22">Sorted peptide query, neighbors are adjacent</text>
<text x="890" y="566" fill="#e8efec" font-size="19">A few first touches, the rest hit warm pages, ~61 µs</text>
<text x="890" y="594" fill="#e8efec" font-size="19">1,245 peptides in 0.5 s, load time is the whole cost</text>
<text x="1660" y="632" text-anchor="end" fill="#9db3ab" font-size="14">*derived, not measured: ~2.4 KB = 64 x 37.76 B/k-mer, 1 MB / 2.4 KB, 1.8 TiB - 265 GB. Cell colors illustrative. Cache is shared with other jobs.</text>
</svg>