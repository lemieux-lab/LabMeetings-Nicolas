<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 640" width="1700" height="640" font-family="'Archivo', sans-serif">
<rect x="0" y="0" width="1700" height="640" rx="14" fill="#151f1b"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9db3ab"/></marker></defs>
<rect x="40" y="30" width="760" height="150" rx="10" fill="none" stroke="#3ecfa2" stroke-width="2"/>
<text x="60" y="62" fill="#3ecfa2" font-size="22">In RAM after load (265 GB, the ~45 min load)</text>
<rect x="60" y="80" width="340" height="80" rx="8" fill="none" stroke="#9db3ab" stroke-width="1.5"/>
<text x="230" y="112" text-anchor="middle" fill="#e8efec" font-size="20">Sorted k-mer index</text>
<text x="230" y="140" text-anchor="middle" fill="#9db3ab" font-size="17">delta-encoded, prefix buckets</text>
<rect x="420" y="80" width="360" height="80" rx="8" fill="none" stroke="#9db3ab" stroke-width="1.5"/>
<text x="600" y="112" text-anchor="middle" fill="#e8efec" font-size="20">block_ptr</text>
<text x="600" y="140" text-anchor="middle" fill="#9db3ab" font-size="17">byte offset of every 64-k-mer block</text>
<rect x="900" y="30" width="760" height="150" rx="10" fill="none" stroke="#f0b429" stroke-width="2"/>
<text x="920" y="62" fill="#f0b429" font-size="22">One peptide query</text>
<text x="920" y="100" fill="#e8efec" font-size="19">1. Peptide becomes a few k-mer tiles, sorted</text>
<text x="920" y="130" fill="#e8efec" font-size="19">2. findfirst in the RAM index, ~36 µs, never touches the blob</text>
<text x="920" y="160" fill="#e8efec" font-size="19">3. Row i lives in block (i-1)÷64, block_ptr gives its offset</text>
<path d="M780,120 L900,120" stroke="#9db3ab" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M1280,180 L1280,235 L436,235 L436,316" stroke="#9db3ab" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arr)"/>
<text x="860" y="224" text-anchor="middle" fill="#9db3ab" font-size="17">jump to the block at that offset</text>
<rect x="40" y="260" width="1620" height="200" rx="10" fill="none" stroke="#9db3ab" stroke-width="2"/>
<text x="1640" y="292" text-anchor="end" fill="#9db3ab" font-size="22">Counts blob on disk, 2.1 TiB, memory-mapped, served from the OS page cache</text>
