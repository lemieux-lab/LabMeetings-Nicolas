<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <style>
      .card   { fill:#151f1b; }
      .base   { fill:#2a3a33; stroke:#3a4a43; stroke-width:1; }
      .shard  { fill:#3ecfa2; stroke:#1c2822; stroke-width:1; }
      .ceil   { stroke:#e58468; stroke-width:2.5; stroke-dasharray:10,6; }
      .title  { fill:#e8efec; font-family:'Archivo', sans-serif; font-size:17px; font-weight:700; }
      .lbl    { fill:#9db3ab; font-family:'Archivo', sans-serif; font-size:13px; }
      .ceilT  { fill:#e58468; font-family:'JetBrains Mono', monospace; font-size:12.5px; font-weight:700; }
    </style>
  </defs>

  <rect class="card" x="0" y="0" width="1000" height="420" rx="14"/>

  <text class="title" x="40" y="40">attempts 1-3 · --cpus 24</text>
  <text class="title" x="560" y="40">attempt 4 · --cpus 6</text>

  <!-- OOM ceiling line, same height both sides -->
  <line class="ceil" x1="30" y1="90" x2="470" y2="90"/>
  <text class="ceilT" x="36" y="82">OOM ceiling</text>
  <line class="ceil" x1="530" y1="90" x2="970" y2="90"/>
  <text class="ceilT" x="536" y="82">OOM ceiling</text>

  <!-- Left stack: base + 8 shard buffers, crosses the ceiling -->
  <rect class="base" x="80" y="260" width="120" height="100" rx="4"/>
  <text class="lbl" x="90" y="315">already</text>
  <text class="lbl" x="90" y="332">merged</text>

  <g>
    <rect class="shard" x="80" y="245" width="26" height="15"/>
    <rect class="shard" x="110" y="230" width="26" height="15"/>
    <rect class="shard" x="140" y="215" width="26" height="15"/>
    <rect class="shard" x="170" y="200" width="26" height="15"/>
    <rect class="shard" x="80" y="185" width="26" height="15"/>
    <rect class="shard" x="110" y="170" width="26" height="15"/>
    <rect class="shard" x="140" y="155" width="26" height="15"/>
    <rect class="shard" x="170" y="105" width="26" height="40"/>
  </g>
  <text class="lbl" x="220" y="200">W = clamp(24,1,8) = 8</text>
  <text class="lbl" x="220" y="220">8 concurrent shard buffers</text>

  <!-- Right stack: same base, only 6 shard buffers, stays under ceiling -->
  <rect class="base" x="620" y="260" width="120" height="100" rx="4"/>
  <text class="lbl" x="630" y="315">already</text>
  <text class="lbl" x="630" y="332">merged</text>

  <g>
    <rect class="shard" x="620" y="245" width="26" height="15"/>
    <rect class="shard" x="650" y="230" width="26" height="15"/>
    <rect class="shard" x="680" y="215" width="26" height="15"/>
    <rect class="shard" x="710" y="200" width="26" height="15"/>
    <rect class="shard" x="620" y="185" width="26" height="15"/>
    <rect class="shard" x="650" y="170" width="26" height="15"/>
  </g>
  <text class="lbl" x="760" y="200">W = clamp(6,1,8) = 6</text>
  <text class="lbl" x="760" y="220">6 concurrent shard buffers</text>

  <text class="lbl" x="40" y="390">1,500 -&gt; 1,650 -&gt; 1,800 GB only raised the ceiling. W stayed pinned at 8 across all three. --cpus 6 is the first attempt to shrink W itself.</text>
</svg>
